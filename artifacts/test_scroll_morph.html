<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scroll Morph Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="min-h-[250vh]">

  <!-- Header / Breadcrumb Space -->
  <div class="h-24 bg-white border-b border-slate-200 flex items-center px-8">
    <span class="text-sm font-semibold text-slate-700">Suffix IT - Product Showcase Simulation</span>
  </div>

  <!-- Sticky Stage Container -->
  <div id="scrollContainer" class="relative h-[200vh] w-full">
    <div class="sticky top-12 flex flex-col items-center justify-start overflow-visible pt-4">

      <!-- Title / Header -->
      <div id="titleBlock" class="mb-5 text-center max-w-3xl px-4 transition-all duration-300">
        <span class="inline-block px-3 py-1 mb-2 rounded-full bg-sky-100 text-sky-800 text-xs font-bold uppercase tracking-wider">
          Enterprise Solution • Web & Mobile Suite
        </span>
        <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
          HR & Payroll Central Command
        </h1>
        <p class="mt-2 text-sm text-slate-600">
          Automate attendance, payroll calculation, tax compliance, and employee self-service.
        </p>
      </div>

      <!-- Dual Device Showcase -->
      <div class="relative flex items-center justify-center gap-12 mt-2">

        <!-- Left: Laptop & Morphing Tablet -->

          <!-- 1. Screen -> Tablet -->
          <div id="screenTablet" class="relative z-20 w-[520px] h-[330px] rounded-[18px] bg-[#0c0d12] p-2.5 shadow-[0_20px_50px_-10px_rgba(0,0,0,0.5)] border border-[#23242c] transition-all duration-300 origin-center">
            <!-- Camera Notch (Fades out when tablet) -->
            <div id="cameraNotch" class="absolute top-2.5 left-1/2 -translate-x-1/2 h-3 w-20 bg-[#0c0d12] rounded-b-md flex items-center justify-center z-30 transition-opacity">
              <div class="h-1.5 w-1.5 rounded-full bg-[#181920] ring-1 ring-sky-900/60"></div>
            </div>

            <!-- Screen Glass Content -->
            <div id="screenContent" class="relative w-full h-full rounded-[12px] bg-[#14151e] overflow-hidden flex items-center justify-center border border-white/5 transition-all">
              <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1000&q=80" class="w-full h-full object-cover" />
              <!-- Glass sheen -->
              <div class="pointer-events-none absolute inset-0 bg-gradient-to-tr from-transparent via-white/5 to-white/10"></div>
            </div>
          </div>

          <!-- 2. Hinge Bar (Fades out on scroll) -->
          <div id="hingeBar" class="relative z-10 -mt-1 w-[460px] h-[7px] bg-[#121318] border-t border-black border-b border-[#2a2b36] transition-opacity"></div>

          <!-- 3. Realistic 3D Keyboard Base (SVG - Folded 90° on desk, stays in background and fades) -->

                  <stop offset="35%" stop-color="#1b1c24" />

                  <stop offset="100%" stop-color="#15161c" />

            <!-- Table Surface Shadow -->

        </div>

        <!-- Right: Mobile Companion App -->
        <div id="mobileContainer" class="relative flex flex-col items-center self-end mb-1 transition-all duration-300 origin-bottom">
          <div class="relative h-[360px] w-[180px] rounded-[38px] bg-[#0c0d10] p-[7px] shadow-[0_20px_50px_-10px_rgba(0,0,0,0.4)] border border-[#27282f]">
            <div class="absolute -left-[3px] top-16 h-8 w-[2px] rounded-l bg-[#3f4048]"></div>
            <div class="absolute -left-[3px] top-26 h-8 w-[2px] rounded-l bg-[#3f4048]"></div>
            <div class="absolute -right-[3px] top-20 h-11 w-[2px] rounded-r bg-[#3f4048]"></div>

            </div>
            <div class="w-full h-full rounded-[30px] bg-[#111215] overflow-hidden">
              <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&q=80" class="w-full h-full object-cover" />
            </div>
            <div class="absolute bottom-2 left-1/2 -translate-x-1/2 z-30 h-1 w-12 rounded-full bg-white/40"></div>
          </div>
          <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-[150px] h-6 bg-slate-950/25 blur-lg rounded-full -z-10"></div>

          <div id="mobileLabel" class="mt-4 opacity-0 inline-flex items-center gap-1.5 rounded-full border border-sky-200 bg-white/95 px-3 py-1 text-xs font-semibold text-slate-800 shadow-sm backdrop-blur transition-all">
            <span class="h-1.5 w-1.5 rounded-full bg-sky-500 animate-pulse"></span>
            Employee Mobile Portal
          </div>
        </div>

      </div>

    </div>
  </div>

  <script>
    function updateTransforms(p) {
      // p ranges from 0 to 1
      const title = document.getElementById('titleBlock');
      const screenTablet = document.getElementById('screenTablet');
      const screenContent = document.getElementById('screenContent');
      const cameraNotch = document.getElementById('cameraNotch');
      const hinge = document.getElementById('hingeBar');
      const keyboard = document.getElementById('keyboardBase');
      const baseShadow = document.getElementById('baseShadow');
      const mobile = document.getElementById('mobileContainer');
      const tabletLabel = document.getElementById('tabletLabel');
      const mobileLabel = document.getElementById('mobileLabel');

      // 1. Title fade: p 0 -> 0.15
      const titleOpacity = Math.max(0, 1 - p / 0.15);
      title.style.opacity = titleOpacity;
      title.style.transform = `translateY(${-p * 60}px)`;

      // 2. Keyboard & Hinge fade: p 0 -> 0.35
      const baseOpacity = Math.max(0, 1 - p / 0.35);
      keyboard.style.opacity = baseOpacity;
      hinge.style.opacity = baseOpacity;
      baseShadow.style.opacity = baseOpacity;
      cameraNotch.style.opacity = Math.max(0, 1 - p / 0.25);

      // 3. Tablet Morph & Scale:
      // Scale from 1.0 -> 1.28
      // TranslateY downwards / centering to align with mobile: 0 -> 50px
      // BorderRadius: 18px -> 28px
      const progress = Math.min(1, p / 0.5);
      const scale = 1.0 + progress * 0.28;
      const translateY = progress * 50;
      const borderRadius = 18 + progress * 10;
      const innerRadius = 12 + progress * 8;

      screenTablet.style.transform = `translateY(${translateY}px) scale(${scale})`;
      screenTablet.style.borderRadius = `${borderRadius}px`;
      screenContent.style.borderRadius = `${innerRadius}px`;

      // 4. Mobile scale: 1.0 -> 1.2
      const mobileScale = 1.0 + progress * 0.20;
      const mobileY = progress * 10;
      mobile.style.transform = `translateY(${mobileY}px) scale(${mobileScale})`;

      // 5. Labels: appear after p > 0.3
      const labelOpacity = Math.max(0, Math.min(1, (p - 0.3) / 0.2));
      tabletLabel.style.opacity = labelOpacity;
      mobileLabel.style.opacity = labelOpacity;
    }

    window.addEventListener('scroll', () => {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const p = Math.max(0, Math.min(1, window.scrollY / (window.innerHeight * 1.0)));
      updateTransforms(p);
    });

    // Support query param for static testing: ?progress=0.4
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('progress')) {
      updateTransforms(parseFloat(urlParams.get('progress')));
    }
  </script>
</body>
</html>
